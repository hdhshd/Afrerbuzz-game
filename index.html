<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101318"><title>AFTERBUZZ — Basketball Life Sim</title>
<style>
:root{--bg:#101318;--panel:#191e26;--panel2:#222936;--ink:#f4f4ef;--muted:#a6adba;--lime:#d7ff58;--orange:#ff8a47;--line:#343c49;--red:#ff6969}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#242d39 0,#101318 55%);color:var(--ink);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#29313e;color:var(--ink);font-weight:750;transition:.15s}button:active{transform:scale(.98)}button.primary{background:var(--lime);color:#14180b;border-color:var(--lime)}button.ghost{background:transparent}button:disabled{opacity:.35;cursor:not-allowed}
.app{max-width:960px;margin:auto;padding:env(safe-area-inset-top) 14px calc(90px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 2px 12px;gap:10px}.brand{font-size:12px;letter-spacing:.24em;color:var(--lime);font-weight:900}.logo{font-size:clamp(25px,7vw,40px);font-weight:1000;letter-spacing:-.06em;line-height:1}.logo span{color:var(--lime)}.season-tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:7px 9px;border-radius:99px;white-space:nowrap}
.hero{border:1px solid #48513c;border-radius:20px;padding:20px;background:linear-gradient(125deg,#2c3529,#1c232b 62%,#33251d);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;border:1px solid #a9ce54;border-radius:50%;right:-60px;top:-65px;box-shadow:0 0 0 20px #d7ff5808,0 0 0 42px #d7ff5805}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--lime);font-weight:900;text-transform:uppercase}.hero h1{font-size:27px;line-height:1.05;margin:10px 0 8px;max-width:540px;letter-spacing:-.04em}.hero p{color:#d4d9cf;max-width:570px;margin:0 0 16px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px}.metric small{display:block;color:var(--muted);font-size:10px;letter-spacing:.09em;text-transform:uppercase}.metric strong{font-size:22px;display:block;margin-top:3px}.metric em{font-style:normal;color:var(--lime);font-size:11px}.tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 12px;scrollbar-width:none}.tabs button{white-space:nowrap;padding:9px 12px;font-size:12px}.tabs button.active{background:var(--lime);color:#14180b;border-color:var(--lime)}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.panel h2{font-size:16px;margin:0 0 12px;letter-spacing:-.02em}.muted{color:var(--muted)}.small{font-size:12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.pill{display:inline-block;border-radius:99px;background:#2d3643;padding:4px 8px;font-size:10px;color:#cbd1dc}.lime{color:var(--lime)}.bar{height:7px;background:#343c49;border-radius:99px;overflow:hidden;margin:6px 0 11px}.bar i{height:100%;display:block;background:var(--lime);border-radius:99px}.rowitem{padding:11px 0;border-bottom:1px solid var(--line)}.rowitem:last-child{border:0}.rowitem strong{display:block}.rowitem p{margin:4px 0;color:var(--muted);font-size:12px}.actions{display:grid;gap:8px}.actions button{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px}.actions button span{display:block;font-weight:500;color:var(--muted);font-size:11px}.choice{display:block;width:100%;text-align:left;margin:8px 0;background:#222936}.choice b{display:block;color:var(--lime);font-size:12px;margin-bottom:4px}.choice span{font-size:12px;color:#c2c8d2;font-weight:400}.feed{max-height:290px;overflow:auto}.feed .rowitem{font-size:12px}.scoreboard{background:#0c0f13;border:1px solid #3c4652;border-radius:16px;padding:15px;margin:10px 0}.scoretop{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase}.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px;padding:15px 0}.score .num{font-size:42px;font-weight:1000;letter-spacing:-.05em}.score .team{font-size:11px;color:var(--muted)}.clock{text-align:center;color:var(--lime);font-weight:900;font-size:12px}.boxscore{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.boxscore div{background:#1c232b;border-radius:9px;text-align:center;padding:8px}.boxscore b{display:block;font-size:18px}.boxscore small{font-size:9px;color:var(--muted)}.bottomnav{position:fixed;bottom:0;left:0;right:0;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#101318ed;backdrop-filter:blur(15px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.bottomnav div{width:min(960px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.bottomnav button{font-size:11px;padding:10px 5px;background:transparent;border:0;color:var(--muted)}.bottomnav button.active{color:var(--lime);background:#d7ff5810}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:12px;background:#11161d;color:var(--ink);border:1px solid var(--line);border-radius:10px}.full{grid-column:1/-1}.toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--lime);color:#14180b;font-weight:800;padding:10px 16px;border-radius:99px;z-index:10;box-shadow:0 5px 25px #0008}.hidden{display:none!important}.footer{text-align:center;color:#677180;font-size:10px;padding:20px 0}.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
@media(max-width:680px){.layout{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.hero{padding:17px}.hero h1{font-size:25px}.metric{padding:11px}.metric strong{font-size:21px}.top{padding-top:15px}.boxscore{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body><div id="app" class="app"></div><div class="bottomnav" id="bottomnav"></div><script>
const $=s=>document.querySelector(s);
const names=["Jalen Cross","Mira Ellis","Darius Boone","KJ Whitaker","Sanaa Price","Noah Velez","Trey Maddox","Imani Brooks","Cam Redd","Zuri Hayes","Andre Bell","Niko James","Talia Grant","Micah Ford","Devin Cole"];
const surnames=["Bennett","Holloway","Reed","Carter","Monroe","James","Foster","Wells","Parker","Cole","Banks","Hayes","Brooks","Price","Dawson"];
const firsts=["Jace","Rylan","Kendall","Ari","Myles","Jordan","Zion","Tatum","Skye","Cameron","Reese","Dre","Nia","Khalil","Amari","Keira","Jules","Tyson"];
const schools=["East Harbor High","Northline Prep","St. Vincent Academy","Westbridge High","Cedar Grove","Monument Charter","Calvert Tech","Bayshore Catholic"];
const places=["East Harbor gym","Rec Center court 2","Northline Prep","Harborview Park","Coach’s training studio","the school library","a teammate’s driveway","Downtown Fieldhouse"];
const pick=a=>a[Math.floor(Math.random()*a.length)], clamp=(n,a,b)=>Math.max(a,Math.min(b,n)), cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function fresh(){return {created:false,name:"",nick:"",school:"East Harbor High",position:"PG",height:"6'2\"",archetype:"Three-Level Creator",year:10,week:1,day:1,time:"3:18 PM",energy:86,confidence:61,health:95,rep:8,grade:84,cash:65,ovr:64,stats:{fin:62,mid:65,three:68,handle:66,pass:64,def:57,iq:61,stamina:67},badges:[],relationships:[],log:[],screen:"home",lastGame:null,season:{w:0,l:0,pts:0,ast:0,reb:0,gp:0},career:{w:0,l:0,gp:0},teamMorale:60,storyFlags:[],game:null,practiceCount:0,offers:[],inventory:["Beat-up backpack","Practice gear"],schedule:[]}}
let S;try{S=JSON.parse(localStorage.getItem("afterbuzz_save"))||fresh()}catch(e){S=fresh()}
function save(){localStorage.setItem("afterbuzz_save",JSON.stringify(S))}
function log(msg){S.log.unshift({date:`Y${S.year-9} • W${S.week}`,msg});S.log=S.log.slice(0,30)}
function toast(msg){let t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function timeAdvance(hours=1){S.energy=clamp(S.energy-(hours*5),8,100);let h=parseInt(S.time)||3;S.time=(h+hours)+":18 PM";if(h+hours>=8){S.week++;S.day=1;S.time="3:18 PM";if(S.week>12){S.week=1;S.year++;S.season={w:0,l:0,pts:0,ast:0,reb:0,gp:0};S.grade=clamp(S.grade+2,55,100);log(`A new school year begins. You're now in grade ${S.year===10?"sophomore":S.year===11?"junior":S.year===12?"senior":"post-grad"} territory.`);toast("NEW SEASON • YEAR ADVANCED")}}save()}
function relation(name,role="Teammate"){let r=S.relationships.find(x=>x.name===name);if(!r){r={name,role,trust:40,chemistry:35,respect:35,tension:8,notes:"You’ve only just crossed paths."};S.relationships.push(r)}return r}
function person(){let n=pick(firsts)+" "+pick(surnames);return n}
function awardBadge(b){if(!S.badges.includes(b)){S.badges.push(b);log("BADGE UNLOCKED: "+b);toast("BADGE UNLOCKED: "+b)}}
function createPlayer(){let f=$("#pname").value.trim()||"Malik Carter";S.name=f;S.nick=$("#pnick").value.trim()||f.split(" ")[0];S.school=$("#school").value;S.position=$("#position").value;S.height=$("#height").value;S.archetype=$("#arch").value;S.created=true;let friend=person();relation(friend,"Potential Friend");log(`${S.nick} starts sophomore year at ${S.school}. New gym, new pecking order, no guarantees.`);log(`First face you'll remember: ${friend}. They're hard to read so far.`);save();render();toast("CAREER CREATED")}
function nextStory(){let scenes=[
()=>{let n=person(),r=relation(n,"Teammate");return {title:`A stranger at the baseline`,body:`${n} watches your warm-up without saying much. After a few possessions, they ask if you want to run next time. Their vibe is hard to read.`,choices:[["Keep it hoop-focused","You ask what level they usually play.",()=>{r.respect+=5;r.chemistry+=3;S.rep+=2;log(`${n} respects that you asked about their game first.`)}],["Bring some humor","You joke that they look like they came to collect rent.",()=>{r.chemistry+=8;r.trust+=2;log(`${n} laughs, but you still don't know them yet.`)}],["Stay guarded","You nod and keep stretching.",()=>{r.trust-=1;S.energy+=2;log(`You keep your focus. ${n} may need more time to open up.`)}]]}},
()=>{let n=person(),r=relation(n,"Coach / Mentor");return {title:"A quiet evaluation",body:`Coach ${n.split(" ")[1]} has been watching the details: how you talk on defense, whether you sprint back, and how you react after a miss. They pull you aside.`,choices:[["Ask for the blunt truth","You ask what would keep you off the floor.",()=>{S.stats.iq=clamp(S.stats.iq+2,1,99);r.respect+=7;S.rep+=1;log(`Coach ${n} gives you one concrete thing to fix: early help-side positioning.`)}],["Show confidence","You say you know you can make an impact.",()=>{S.confidence=clamp(S.confidence+5,1,100);r.respect+=2;log(`Coach ${n} says confidence is good; proof is better.`)}],["Listen first","You let them finish before responding.",()=>{r.trust+=5;S.stats.def=clamp(S.stats.def+1,1,99);log(`Coach ${n} notices you can take instruction.`)}]]}},
()=>{let n=person(),r=relation(n,"Classmate");return {title:"Outside the gym",body:`In the hallway, ${n} recognizes you from open gym. They have a whole life outside basketball and aren't automatically impressed by your highlights.`,choices:[["Actually get to know them","Ask what they're into when they're not at school.",()=>{r.trust+=7;r.chemistry+=6;S.rep+=1;log(`You have your first real conversation with ${n}.`)}],["Talk hoops","Ask if they know any good runs around town.",()=>{r.respect+=3;S.rep+=2;log(`${n} mentions a local weekend run. Could be useful.`)}],["Keep moving","You have a lot on your mind today.",()=>{S.energy+=2;log(`You don't force a connection with ${n}.`)}]]}},
()=>{let subject=pick(["English II","Geometry","Biology","U.S. History"]);return {title:`A class grade is on the line`,body:`Your ${subject} teacher announces a short assessment coming up. You're doing fine, but ignoring it could turn into a problem during the season.`,choices:[["Put in a focused 25 minutes","Review the material instead of scrolling.",()=>{S.grade=clamp(S.grade+3,0,100);S.energy-=4;log(`${subject}: focused review helped your grade.`)}],["Ask a classmate to study","Make it a shared study session.",()=>{S.grade=clamp(S.grade+2,0,100);let n=person();relation(n,"Study Partner").trust+=3;log(`You arranged a study session for ${subject}.`)}],["Leave it for later","You prioritize recovery today.",()=>{S.energy=clamp(S.energy+5,0,100);S.grade=clamp(S.grade-2,0,100);log(`You rested, but the ${subject} assessment is still coming.`)}]]}}
];let scene=pick(scenes)();S.currentScene=scene;S.screen="story";save();render()}
function startGame(kind="School scrimmage"){if(S.game){toast("Finish the current game first");return}let opp=pick(["Northline Prep","Westbridge High","Cedar Grove","Monument Charter","a local AAU select team","St. Vincent Academy"]);S.game={kind,opp,our:0,their:0,period:1,clock:8*60,poss:0,stats:{pts:0,ast:0,reb:0,stl:0,to:0},feed:[`Tip-off: ${S.school} vs ${opp}. The gym is loud enough to make communication matter.`],done:false};S.screen="game";log(`${kind} scheduled against ${opp}.`);save();render()}
function gameAction(action){let g=S.game;if(!g||g.done)return;g.poss++;g.clock=Math.max(0,g.clock-(18+Math.floor(Math.random()*8)));S.energy=clamp(S.energy-2,0,100);
let skill=action==="Pull-up jumper"?S.stats.mid:action==="Attack the rim"?S.stats.fin:action==="Create a three"?S.stats.three:action==="Set up a teammate"?S.stats.pass:action==="Lock in on defense"?S.stats.def:S.stats.iq;
let roll=Math.random()*100, success=roll<clamp(skill+S.confidence*.12-S.energy*.12-32,12,76);
if(action==="Set up a teammate"){if(success){g.our+=2;g.stats.ast++;g.feed.unshift("You draw two defenders and hit the cutter. Assist.");S.confidence=clamp(S.confidence+1,0,100)}else{g.feed.unshift("The passing lane closes. You keep the ball moving but the possession stalls.");if(Math.random()<.25)g.stats.to++}}
else if(action==="Lock in on defense"){if(success){g.their=Math.max(0,g.their-(Math.random()<.25?2:0));g.feed.unshift("You sit down, cut off the first move, and force a tough miss.");g.stats.stl+=Math.random()<.3?1:0;S.stats.def=clamp(S.stats.def+(Math.random()<.2?1:0),1,99)}else{g.feed.unshift("Your matchup gets a step. You recover late and have to reset.");if(Math.random()<.25)g.their+=2}}
else if(success){let pts=action==="Create a three"?3:2;g.our+=pts;g.stats.pts+=pts;g.feed.unshift(action==="Pull-up jumper"?"Cash. You stop on balance and rise over the contest.":action==="Attack the rim"?"You get downhill, absorb contact, and finish through traffic.":"Catch, feet set, release. Three.");S.confidence=clamp(S.confidence+2,0,100);if(g.stats.pts>=10)awardBadge("Bucket Getter I")}
else{g.feed.unshift(action==="Create a three"?"The three rims out. You sprint back on defense.":"No bucket. The defender stayed attached and made you work.");if(Math.random()<.3)g.their+=2;S.confidence=clamp(S.confidence-1,0,100)}
if(Math.random()<.23){g.their+=2;g.feed.unshift(`${g.opp} answers with a quick score.`)}
if(g.clock<=0){if(g.period<4){g.period++;g.clock=8*60;g.feed.unshift(`End of quarter ${g.period-1}. Coach wants sharper decisions.`)}else if(g.our===g.their){g.period=5;g.clock=2*60;g.feed.unshift("Tied after regulation. Overtime. Every possession matters.")}else finishGame()}
g.feed=g.feed.slice(0,8);save();render()}
function finishGame(){let g=S.game;g.done=true;let win=g.our>g.their;S.season.gp++;S.season.pts+=g.stats.pts;S.season.ast+=g.stats.ast;S.season.w+=win?1:0;S.season.l+=win?0:1;S.career.gp++;S.career.w+=win?1:0;S.career.l+=win?0:1;S.rep+=win?4:1;S.cash+=win?15:5;S.teamMorale=clamp(S.teamMorale+(win?5:-3),0,100);S.lastGame={...g,win};if(g.stats.pts>=12){S.stats.three=clamp(S.stats.three+1,1,99);S.ovr=clamp(S.ovr+1,40,99);awardBadge("Pressure Proof I")}log(`${win?"WIN":"LOSS"} vs ${g.opp}, ${g.our}-${g.their}. ${g.stats.pts} points, ${g.stats.ast} assists. Results carry forward.`);S.game=null;S.screen="result";save()}
function actionPractice(type){let cost=type==="Recovery session"?-10:12; if(type!=="Recovery session"&&S.energy<20){toast("Too tired. Recover first.");return}let map={"Midrange lab":["mid",2],"Deep-range reps":["three",2],"Handle under pressure":["handle",2],"Playmaking film":["iq",2],"Finishing through contact":["fin",2],"Defensive footwork":["def",2],"Recovery session":["health",4]};let [key,gain]=map[type];S.stats[key]=clamp(S.stats[key]+gain,1,99);if(type==="Recovery session"){S.energy=clamp(S.energy+22,0,100);S.health=clamp(S.health+4,0,100)}else{S.energy=clamp(S.energy-cost,0,100);S.practiceCount++;S.confidence=clamp(S.confidence+1,0,100)}S.ovr=Math.round(Object.values(S.stats).reduce((a,b)=>a+b,0)/Object.values(S.stats).length);log(`${type}: ${key.toUpperCase()} ${type==="Recovery session"?"+4":"+2"}. Energy ${S.energy}%.`);if(S.practiceCount>=5)awardBadge("Gym Rat I");timeAdvance(1);save();render();toast(type+" complete")}
function render(){if(!S.created){$("#app").innerHTML=`<div class="top"><div><div class="brand">A NEW KIND OF CAREER MODE</div><div class="logo">AFTER<span>BUZZ</span></div></div><div class="season-tag">BUILD 0.1 • PLAYABLE</div></div><div class="hero"><div class="eyebrow">Your story starts before the tip-off</div><h1>Everybody sees the highlights.<br>Who are you when the gym empties?</h1><p>A living basketball life sim. Build your game, navigate school, earn trust, find your people, and make decisions that echo through an open-ended career.</p><div class="tagrow"><span class="pill">PLAYER-DRIVEN</span><span class="pill">CHOICES MATTER</span><span class="pill">SAVE ON THIS PHONE</span></div></div><div class="panel" style="margin-top:12px"><h2>Build your player</h2><div class="formgrid"><div class="field"><label>Full name</label><input id="pname" placeholder="Malik Carter" maxlength="32"></div><div class="field"><label>Nickname</label><input id="pnick" placeholder="Lik" maxlength="18"></div><div class="field"><label>Starting school year</label><input value="Sophomore • Fall" disabled></div><div class="field"><label>Height</label><select id="height"><option>5'10"</option><option>6'0"</option><option>6'2"</option><option selected>6'4"</option><option>6'6"</option><option>6'8"</option></select></div><div class="field"><label>Position</label><select id="position"><option>PG</option><option>SG</option><option>SF</option><option>PF</option><option>C</option><option>Point Forward</option></select></div><div class="field"><label>Play style</label><select id="arch"><option>Three-Level Creator</option><option>Pass-First Floor General</option><option>Two-Way Point Forward</option><option>Shot-Making Guard</option><option>Defensive Menace</option><option>Slashing Playmaker</option></select></div><div class="field full"><label>School</label><select id="school">${schools.map(s=>`<option>${s}</option>`).join("")}</select></div><div class="full"><button class="primary" style="width:100%" onclick="createPlayer()">START SOPHOMORE YEAR ↗</button><p class="muted small">Your choices, relationships, season stats and progression save automatically in this browser.</p></div></div></div><div class="footer">AFTERBUZZ is an original fictional prototype. No real school or recruiting offer is implied.</div>`;$("#bottomnav").innerHTML="";return}
let screen=S.screen||"home";let title=S.name;let nav=[["home","⌂","Today"],["court","◉","The Court"],["people","◎","People"],["profile","▤","Player"]];$("#bottomnav").innerHTML=`<div>${nav.map(([id,ic,n])=>`<button class="${screen===id?"active":""}" onclick="go('${id}')">${ic} ${n}</button>`).join("")}</div>`;
let top=`<div class="top"><div><div class="brand">AFTERBUZZ / CAREER FILE</div><div class="logo">AFTER<span>BUZZ</span></div></div><div class="season-tag">YEAR ${S.year-9} • WEEK ${S.week}</div></div>`;
let hero=`<div class="hero"><div class="eyebrow">${S.school} • SOPHOMORE SEASON</div><h1>${S.nick.toUpperCase()} IS STILL<br>WRITING THE STORY.</h1><p>${S.name} · ${S.height} · ${S.position} · ${S.archetype}. Talent gets you noticed. What you do next decides what happens.</p><div class="tagrow"><span class="pill">OVR ${S.ovr}</span><span class="pill">REP ${S.rep}</span><span class="pill">${S.season.w}-${S.season.l} RECORD</span></div></div>`;
let metrics=`<div class="metrics"><div class="metric"><small>Overall</small><strong>${S.ovr}</strong><em>PLAYER RATING</em></div><div class="metric"><small>Energy</small><strong>${S.energy}%</strong><div class="bar"><i style="width:${S.energy}%"></i></div></div><div class="metric"><small>Confidence</small><strong>${S.confidence}</strong><div class="bar"><i style="width:${S.confidence}%"></i></div></div><div class="metric"><small>School grade</small><strong>${S.grade}%</strong><em>${S.grade>=90?"A":S.grade>=80?"B":S.grade>=70?"C":"NEEDS WORK"}</em></div></div>`;
let body="";
if(screen==="home"){body=`${hero}${metrics}<div class="layout"><div class="panel"><div class="section-head"><h2>What's next?</h2><span class="pill">${S.time}</span></div><div class="actions"><button onclick="go('court')">◉ Hit the court <span>Train, scrimmage, or chase a run →</span></button><button onclick="nextStory()">✳ Let the day happen <span>Meet someone or face a new situation →</span></button><button onclick="study()">▤ Handle school <span>Grades matter when the season gets busy →</span></button><button onclick="rest()">☾ Recover <span>Restore energy and protect your health →</span></button></div><div class="rowitem"><strong>Season pulse</strong><p>${S.season.w} wins · ${S.season.l} losses · ${S.season.gp} games played · ${S.season.pts} points scored</p></div></div><div class="panel"><h2>Latest from your world</h2><div class="feed">${S.log.slice(0,5).map(x=>`<div class="rowitem"><span class="pill">${x.date}</span><p>${x.msg}</p></div>`).join("")||'<p class="muted">Your story is just getting started.</p>'}</div><button class="ghost" style="width:100%;margin-top:8px" onclick="nextStory()">GENERATE A STORY BEAT ↗</button></div></div>`}
else if(screen==="court"){body=`${hero}${metrics}<div class="layout"><div class="panel"><h2>Training floor</h2><p class="muted small">Focused work raises attributes gradually. Fatigue is real; recovery matters.</p><div class="actions">${["Midrange lab","Deep-range reps","Handle under pressure","Playmaking film","Finishing through contact","Defensive footwork","Recovery session"].map(x=>`<button onclick="actionPractice('${x}')">${x}<span>${x==="Recovery session"?"Restore energy + health":"Attribute work · +2 skill"}</span></button>`).join("")}</div></div><div class="panel"><h2>Competition calendar</h2><div class="rowitem"><strong>School scrimmage</strong><p>Build chemistry and show the coaching staff your decision-making.</p><button class="primary" style="width:100%" onclick="startGame('School scrimmage')">PLAY SCRIMMAGE</button></div><div class="rowitem"><strong>AAU / weekend circuit</strong><p>More exposure, tougher matchups, and no guaranteed spotlight.</p><button style="width:100%" onclick="startGame('AAU showcase')">ENTER AAU GAME</button></div><div class="rowitem"><strong>Neighborhood open run</strong><p>Unknown players, shifting teams, and reputation at stake.</p><button style="width:100%" onclick="startGame('Open run')">FIND A RUN</button></div><div class="rowitem"><strong>Recovery status</strong><p>Energy ${S.energy}% · Health ${S.health}% · Team morale ${S.teamMorale}%</p></div></div></div>`}
else if(screen==="people"){body=`${hero}<div class="panel"><div class="section-head"><h2>Your relationship web</h2><button class="primary" onclick="meetPerson()">Meet somebody new +</button></div><p class="muted small">Nobody is automatically your best friend. Trust, chemistry, respect and tension move separately based on what you do.</p>${S.relationships.length?S.relationships.map((r,i)=>`<div class="rowitem"><div class="section-head"><div><strong>${r.name}</strong><span class="pill">${r.role}</span></div><span class="pill">${r.tension>35?"TENSE":r.trust>65?"TRUST BUILDING":"GETTING TO KNOW YOU"}</span></div><div class="small muted">Trust ${r.trust} · Chemistry ${r.chemistry} · Respect ${r.respect} · Tension ${r.tension}</div><div class="bar"><i style="width:${r.trust}%"></i></div><p>${r.notes}</p><div class="tagrow"><button onclick="interact(${i},'talk')">Check in</button><button onclick="interact(${i},'hoop')">Invite to hoop</button><button onclick="interact(${i},'space')">Give space</button></div></div>`).join(""):'<p class="muted">You have not built your circle yet. The people you meet will have their own priorities and personalities.</p>'}</div>`}
else if(screen==="profile"){body=`${hero}${metrics}<div class="layout"><div class="panel"><h2>Attribute lab</h2>${Object.entries(S.stats).map(([k,v])=>`<div class="rowitem"><div class="section-head"><strong>${({fin:"Finishing",mid:"Midrange",three:"Three-point",handle:"Handle",pass:"Passing",def:"Defense",iq:"Court IQ",stamina:"Stamina"})[k]}</strong><b>${v}</b></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join("")}</div><div class="panel"><h2>Career ledger</h2><div class="rowitem"><strong>${S.career.gp} games</strong><p>${S.career.w} wins / ${S.career.l} losses</p></div><div class="rowitem"><strong>${S.season.gp?Math.round(S.season.pts/S.season.gp*10)/10:"—"} PPG</strong><p>${S.season.pts} total points this season</p></div><div class="rowitem"><strong>Badges (${S.badges.length})</strong><div class="tagrow">${S.badges.map(b=>`<span class="pill lime">${b}</span>`).join("")||'<span class="muted small">Earn your first badge on court.</span>'}</div></div><div class="rowitem"><strong>Off-court resources</strong><p>Cash: $${S.cash} · School grade: ${S.grade}% · Reputation: ${S.rep}</p></div><button class="ghost" style="width:100%" onclick="if(confirm('Reset this career and erase its local save?')){localStorage.removeItem('afterbuzz_save');S=fresh();render()}">RESET CAREER</button></div></div>`}
else if(screen==="story"){let c=S.currentScene;body=`<div class="hero"><div class="eyebrow">STORY BEAT • YOUR CALL</div><h1>${c.title}</h1><p>${c.body}</p></div><div class="panel" style="margin-top:12px"><h2>How do you handle it?</h2>${c.choices.map((x,i)=>`<button class="choice" onclick="chooseStory(${i})"><b>${String.fromCharCode(65+i)} / ${x[0]}</b><span>${x[1]}</span></button>`).join("")}</div>`}
else if(screen==="game"){if(!S.game){S.screen="home";render();return}let g=S.game;body=`<div class="hero"><div class="eyebrow">${g.kind.toUpperCase()} • LIVE GAME</div><h1>MAKE THE RIGHT READ.</h1><p>Possession by possession. Manage fatigue, find the matchup, and live with the result.</p></div><div class="panel" style="margin-top:12px"><div class="scoreboard"><div class="scoretop"><span>${g.kind}</span><span>QUARTER ${g.period>4?"OT":g.period}</span></div><div class="score"><div><div class="team">${S.school.toUpperCase()}</div><div class="num">${g.our}</div></div><div><div class="clock">${Math.floor(g.clock/60)}:${String(g.clock%60).padStart(2,"0")}</div><div class="team">GAME CLOCK</div></div><div><div class="team">${g.opp.toUpperCase()}</div><div class="num">${g.their}</div></div></div><div class="boxscore"><div><b>${g.stats.pts}</b><small>PTS</small></div><div><b>${g.stats.ast}</b><small>AST</small></div><div><b>${g.stats.reb}</b><small>REB</small></div><div><b>${g.stats.to}</b><small>TURNOVERS</small></div></div></div><h2>Your possession</h2><p class="muted small">Pick a basketball action. Skill, confidence, and energy affect the outcome; no move is automatic.</p><div class="actions">${["Pull-up jumper","Create a three","Attack the rim","Set up a teammate","Lock in on defense"].map(x=>`<button onclick="gameAction('${x}')">${x}<span>${x==="Pull-up jumper"?"Midrange":x==="Create a three"?"Three-point":x==="Attack the rim"?"Finishing":x==="Set up a teammate"?"Passing":"Defense"} rating</span></button>`).join("")}</div><h2 style="margin-top:16px">Courtside feed</h2><div class="feed">${g.feed.map(x=>`<div class="rowitem">${x}</div>`).join("")}</div></div>`}
else if(screen==="result"){let g=S.lastGame;body=`<div class="hero"><div class="eyebrow">FINAL • ${g.win?"WIN":"LOSS"}</div><h1>${g.win?"YOU GOT IT DONE.":"THE TAPE DOESN'T LIE."}</h1><p>One result doesn't define your career. Your response to it might.</p></div><div class="panel" style="margin-top:12px"><div class="scoreboard"><div class="score"><div><div class="team">${S.school}</div><div class="num">${g.our}</div></div><div class="clock">FINAL</div><div><div class="team">${g.opp}</div><div class="num">${g.their}</div></div></div><div class="boxscore"><div><b>${g.stats.pts}</b><small>PTS</small></div><div><b>${g.stats.ast}</b><small>AST</small></div><div><b>${g.stats.stl}</b><small>STL</small></div><div><b>${S.energy}%</b><small>ENERGY</small></div></div></div><p class="muted">Result affects your record, reputation, team morale, and future opportunities.</p><button class="primary" style="width:100%" onclick="go('home')">BACK TO CAREER HUB ↗</button><button style="width:100%;margin-top:8px" onclick="nextStory()">WHAT HAPPENS NEXT?</button></div>`}
$("#app").innerHTML=top+body+`<div class="footer">AFTERBUZZ • A living career, one decision at a time • Prototype 0.1</div>`}
function go(screen){S.screen=screen;save();render()}
function chooseStory(i){let c=S.currentScene;c.choices[i][2]();S.currentScene=null;timeAdvance(1);S.screen="home";save();render();toast("CHOICE RECORDED")}
function meetPerson(){let n=person(),role=pick(["Potential Friend","AAU Prospect","Rival","Classmate","Teammate","Local Trainer"]);let r=relation(n,role);r.notes=pick(["Funny once you get past the quiet first impression.","Competitive, observant, and not quick to trust.","Has ambitions that don't revolve around your career.","Seems friendly, but you haven't seen how they act under pressure.","Knows everybody at the gym, though their loyalty is untested."]);log(`You met ${n} (${role}). Their story is their own.`);save();render()}
function interact(i,type){let r=S.relationships[i];if(type==="talk"){r.trust=clamp(r.trust+4,0,100);r.chemistry=clamp(r.chemistry+3,0,100);r.tension=clamp(r.tension-2,0,100);r.notes="You checked in. Whether they open up depends on consistency over time.";log(`You checked in with ${r.name}.`)}else if(type==="hoop"){r.chemistry=clamp(r.chemistry+6,0,100);r.respect=clamp(r.respect+3,0,100);S.energy=clamp(S.energy-5,0,100);r.notes="You shared court time. Chemistry improved, but competition can expose differences.";log(`You invited ${r.name} to hoop.`)}else{r.tension=clamp(r.tension-3,0,100);r.notes="You gave them room instead of demanding attention.";log(`You gave ${r.name} space.`)}timeAdvance(1);save();render()}
function study(){let result=Math.random()<.75?3:-1;S.grade=clamp(S.grade+result,0,100);S.energy=clamp(S.energy-5,0,100);timeAdvance(1);log(result>0?"You put in a focused study block. Grade improved.":"You studied, but the material is still not clicking. Consider asking for help.");save();render();toast(result>0?"STUDY SESSION: GRADE UP":"STUDY SESSION COMPLETE")}
function rest(){S.energy=clamp(S.energy+22,0,100);S.health=clamp(S.health+3,0,100);S.confidence=clamp(S.confidence+1,0,100);timeAdvance(1);log("You took recovery seriously. Better legs, clearer head.");save();render();toast("RECOVERED")}
render();
</script></body></html>
